await document.fonts.load('40px Lalezar', 'ع');
const label = document.createElement('canvas'); label.width = 256; label.height = 96; { const g = label.getContext('2d'); g.fillStyle = '#ffd400'; g.fillRect(0, 0, 256, 96); g.fillStyle = '#111'; g.fillRect(0, 0, 256, 8); g.fillRect(0, 88, 256, 8); g.font = '40px Lalezar'; g.direction = 'rtl'; g.textAlign = 'center'; g.fillText('النووية ٣٠٠٠', 128, 62); }
const labelT = new THREE.CanvasTexture(label); labelT.colorSpace = THREE.SRGBColorSpace;
const lab = mesh(new THREE.PlaneGeometry(0.22, 0.08), new THREE.MeshStandardMaterial({ map: labelT, roughness: 0.6 }), 0, 0.15, 0.201, pot);

  const curve = new THREE.CatmullRomCurve3(pts);

// ---------- cast ----------

{ const b = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.015), bookM); b.castShadow = true; book.add(b); const pg = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.19, 0.016), new THREE.MeshStandardMaterial({ color: 0xf4f0e4 })); pg.position.x = 0.004; book.add(pg); }

const Q = (x, y, z) => new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z));
function place(a, x, z, ry) { a.holder.position.set(x, 0, z); a.holder.rotation.y = ry; }

// ---------- timeline ----------
const [L1, L2, L3] = DATA.lines; const T_SUCK = DATA.suck_t;
const T2 = L2.t0 - 0.12, T3 = L3.t0 - 0.12, T4 = L3.t0 + 2.35;   // shot cuts
const SC0 = Number(new URLSearchParams(location.search).get('sc') || 1.0);   // where in the scared clip Hamada starts
const nozzleHome = V(-0.62, 1.0, 0.2);
function state(t) {
  // Hamada: scared, pulled towards the nozzle, then yanked in; afterwards only his legs stick out of the pot, kicking
  let s;
  if (t < T_SUCK) {
    const k = ease(t / T_SUCK);
    // running in place as hard as he can, while the machine drags him backwards
    place(son, lerp(-1.15, -0.85, ease(t / T_SUCK) ** 2), lerp(0.55, 0.42, k), -0.35);
    son.holder.rotation.z = 0; son.holder.position.y = 0;
    pose(son, [{ src: CL.run, t: t * 1.35, w: 1 }], { extra: { mixamorigSpine: Q(0.25, 0, 0), mixamorigHead: Q(-0.15, 0.35, 0) } });
    hoseAt(t, nozzleHome.clone().add(V(Math.sin(t * 17) * 0.01, 0, 0)));
  } else if (t < T_SUCK + 0.45) {
    const k = ease((t - T_SUCK) / 0.45);
    place(son, lerp(-0.95, -0.1, k), lerp(0.35, -0.5, k), Math.PI * 0.38);
    son.holder.position.y = Math.sin(k * Math.PI) * 0.5; son.holder.rotation.z = -k * 1.6;
    son.holder.scale.set(1, 1 - 0.2 * Math.sin(k * Math.PI), 1);
    pose(son, [{ src: CL.scared, t: 3.2 + (t - T_SUCK), w: 1 }]);
    hoseAt(t, nozzleHome.clone().lerp(V(-0.15, 0.8, -0.25), k));
  } else {
    // upside down in the pot: legs up, kicking
    const pw = pot.getWorldPosition(new THREE.Vector3());
    son.holder.scale.set(1, 1, 1); son.holder.rotation.set(Math.PI, 0.4, 0);
    son.holder.position.set(pw.x, pw.y + 1.0 + Math.sin(t * 20) * 0.01, pw.z);
    pose(son, [{ src: CL.scared, t: 4 + t * 1.6, w: 1 }]);
    hoseAt(t, V(-0.45, 0.62, 0.1).add(V(Math.sin(t * 9) * 0.02, 0, 0)));
  }
  vac.position.x = 0.05 + Math.sin(t * 47) * 0.004; vac.rotation.z = Math.sin(t * 31) * 0.01;
  ledM.color.setHex(Math.floor(t * 6) % 2 ? 0x3df05a : 0x1a6a2a);
  // Ibrahim: calm, talking to the camera with his notebook; at the end a shrug
  place(dad, 0.85, 0.3, -0.3);
  const sh = ease((t - (T4 + 0.2)) / 0.5);
  pose(dad, [{ src: t < L2.t0 ? CL.idle : CL.talking, t: t < L2.t0 ? t : 1.2 + (t - L2.t0), w: 1 }, { src: CL.shrug, t: 0.4 + Math.max(0, t - T4 - 0.2), w: sh }],
       { extra: { mixamorigHead: Q(0.08, 0, 0) } });
  // Om Hamada: comes in through the door, shouting and pointing
  const ein = ease((t - (T3 - 0.6)) / 0.6);

  place(mom, lerp(-2.95, -1.15, ein2), 0.55, Math.PI / 2 - 1.0 * ein2);

}
function shot(t) {
  if (t < T2) {   // Hamada being pulled towards the nozzle, slow push in
    const k = ease(t / T2); cam.fov = 38; cam.position.set(lerp(-0.55, -0.6, k), 1.3, lerp(3.0, 2.75, k)); cam.lookAt(lerp(-1.0, -0.85, k), 1.0, 0.4);
  } else if (t < T3) {   // Ibrahim, waist up; the pot with Hamada's legs behind him
    const k = ease((t - T2) / (T3 - T2)); cam.fov = 33; cam.position.set(lerp(1.3, 1.25, k), 1.45, lerp(2.5, 2.25, k)); cam.lookAt(0.75, 1.25, 0.1);
  } else if (t < T4) {   // Om Hamada coming in
    const k = ease((t - T3) / (T4 - T3)); cam.fov = 36; cam.position.set(lerp(-0.45, -0.55, k), 1.45, lerp(2.75, 2.55, k)); cam.lookAt(-1.2, 1.2, 0.5);
  } else {   // wide: everyone
    const k = ease((t - T4) / (DUR - T4)); cam.fov = 52; cam.position.set(-0.15, 1.65, lerp(5.0, 4.75, k)); cam.lookAt(-0.15, 0.95, -0.15);
  }
  cam.updateProjectionMatrix();
}
// ---------- dialogue box (series style), text typed along the voice ----------
const NAMES = { son: ['حمادة', '#d4141c'], dad: ['إبراهيم', '#c9a227'], mom: ['أم حمادة', '#1f9e5a'] };
function revealCount(L, t) {
  const words = L.ar.split(' '); const vox = L.vox.length ? L.vox : [[L.t0, L.t1]];
  const total = vox.reduce((s, [a, b]) => s + (b - a), 0); let done = 0;
  for (const [a, b] of vox) { if (t >= b) done += b - a; else if (t > a) done += t - a; }
  const frac = done / total; const lens = words.map(w => w.length + 1); const all = lens.reduce((a, b) => a + b, 0);
  let acc = 0, n = 0; for (const l of lens) { if ((acc + l * 0.5) / all <= frac + 1e-6) { acc += l; n++; } else break; } return n;
}
function dialogue(t) {
