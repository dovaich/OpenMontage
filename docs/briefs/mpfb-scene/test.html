<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body><canvas id="c" width="540" height="960"></canvas><script type="module">
import { THREE, loadActor, loadClips, pose } from './mpfb_runtime.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const R = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true }); R.setSize(540, 960, false);
R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping;
const S = new THREE.Scene(); S.background = new THREE.Color(0x5a6a7a); S.environment = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), 0.04).texture; S.environmentIntensity = 0.5;
const key = new THREE.DirectionalLight(0xfff0dd, 2.2); key.position.set(1.5, 3, 2.5); S.add(key);
const cam = new THREE.PerspectiveCamera(30, 540 / 960, 0.05, 50);
const a = await loadActor('models/' + (new URLSearchParams(location.search).get('m') || 'ibrahim') + '.glb', S);
const clips = await loadClips({ xbot: 'anims/Xbot.glb', talking: 'anims/talking.fbx', scared: 'anims/scared.fbx', yelling: 'anims/yelling.fbx', angry_point: 'anims/angry_point.fbx', shrug: 'anims/shrug.fbx', facepalm: 'anims/facepalm.fbx', arguing: 'anims/arguing.fbx', bragging: 'anims/bragging.fbx' });
window.CLIPS = Object.keys(clips).map(k => k + ':' + clips[k].dur.toFixed(2));
window.shot = (clip, t) => { pose(a, [{ src: clips[clip], t, w: 1 }]); cam.position.set(1.2, 1.2, 3.6); cam.lookAt(0, 0.95, 0); R.render(S, cam); return document.getElementById('c').toDataURL('image/png'); };
window.READY = true;
</script></body></html>
