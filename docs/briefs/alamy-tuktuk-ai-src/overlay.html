<!doctype html><html><head><meta charset="utf-8"><title>Overlay</title>
<style>
@font-face{font-family:'Anton';src:url('node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'Lalezar';src:url('node_modules/@fontsource/lalezar/files/lalezar-arabic-400-normal.woff2') format('woff2');}
html,body{margin:0;background:transparent}
</style></head><body><canvas id="c" width="720" height="1280"></canvas>
<script type="module">
const W = 720, H = 1280, c = document.getElementById('c'), og = c.getContext('2d');
const MODE = new URLSearchParams(location.search).get('m');
let TL, META = { hookEnd: 2.45, rew: [2.45, 3.1], mission: 22.2, total: 30 };
if (MODE === 'flow') { const j = await (await fetch('flow_timeline.json')).json(); TL = j.lines; META = j.meta; } else TL = await (await fetch('timeline.json')).json();
window.TOTAL = META.total;
await document.fonts.load('60px Lalezar'); await document.fonts.load('60px Anton');
const clamp = (x, a, b) => Math.max(a, Math.min(b, x)); const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function txt(s, x, y, size, fill, font = 'Lalezar', align = 'center', stroke = 10) {
  og.font = `${size}px ${font}`; og.textAlign = align; og.direction = /[؀-ۿ]/.test(s) ? 'rtl' : 'ltr';
  og.lineJoin = 'round'; og.lineWidth = stroke; og.strokeStyle = 'rgba(0,0,0,0.92)'; og.strokeText(s, x, y); og.fillStyle = fill; og.fillText(s, x, y);
}
function wrap(s, maxW, size) { og.font = `${size}px Lalezar`; const words = s.split(' '); const lines = []; let cur = ''; for (const w of words) { const t2 = cur ? cur + ' ' + w : w; if (og.measureText(t2).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t2; } if (cur) lines.push(cur); return lines; }
const NAMES = { alamy: ['العالمي', '#e0b04a'], bestem: ['بستم', '#ff8a3a'] };
window.draw = (t) => {
  og.clearRect(0, 0, W, H);
  if (t < META.hookEnd) { const a = smooth(0, 0.2, t) * (1 - smooth(META.hookEnd - 0.25, META.hookEnd, t)); og.globalAlpha = a;
    og.fillStyle = 'rgba(0,0,0,0.55)'; og.fillRect(0, 110, W, 210);
    txt('لما تركّب ذكاء اصطناعي', W / 2, 195, 58, '#ffffff'); txt('للتوك توك... 😐', W / 2, 280, 58, '#ffd04a'); og.globalAlpha = 1; }
  if (t >= META.rew[0] && t < META.rew[1]) {
    og.fillStyle = 'rgba(0,0,0,0.25)'; og.fillRect(0, 0, W, H);
    og.fillStyle = '#fff'; for (let i = 0; i < 2; i++) { og.beginPath(); const x = 60 + i * 44; og.moveTo(x + 40, 90); og.lineTo(x, 115); og.lineTo(x + 40, 140); og.fill(); }
    txt('REWIND', 170, 132, 46, '#fff', 'Anton', 'left', 6); txt('قبلها بـ ٥ دقايق', W / 2, H / 2, 64, '#fff');
    for (let i = 0; i < 6; i++) { og.fillStyle = 'rgba(255,255,255,0.25)'; og.fillRect(0, ((t * 1900 + i * 230) % H), W, 6); }
  }
  for (const ln of TL) {
    if (ln.spk === 'anno' || (ln.id === 'c1' || ln.id.endsWith('_cold')) && t > META.hookEnd || t < ln.at - 0.05 || t > ln.end + 0.3) continue;
    const [name, col] = NAMES[ln.spk]; const lines = wrap(ln.text, W - 90, 46);
    const bh = 70 + lines.length * 58, by = H - bh - 80;
    og.fillStyle = 'rgba(8,8,10,0.78)'; og.fillRect(28, by, W - 56, bh); og.fillStyle = col; og.fillRect(28, by, W - 56, 5);
    txt(name, W - 50, by + 50, 38, col, 'Lalezar', 'right', 6);
    const words = ln.text.split(' '); const k = clamp((t - ln.at) / Math.max(0.3, (ln.end - ln.at) * 0.85), 0, 1); const show = Math.ceil(k * words.length);
    let shown = 0; lines.forEach((L, i) => { const ws = L.split(' '); const vis = ws.slice(0, Math.max(0, show - shown)).join(' '); shown += ws.length; if (vis) txt(vis, W - 50, by + 108 + i * 58, 46, '#ffffff', 'Lalezar', 'right', 7); });
  }
  if (t >= META.mission) {
    const M = META.mission; const a = smooth(M, M + 0.25, t); og.globalAlpha = a; og.fillStyle = 'rgba(0,0,0,0.45)'; og.fillRect(0, 330, W, 450);
    txt('MISSION COMPLETE', W / 2, 440, 80, '#e8c24a', 'Anton', 'center', 12);
    txt('المهمة نجحت', W / 2, 525, 58, '#ffffff');
    og.globalAlpha = smooth(M + 1.9, M + 2.2, t); txt('التوك توك: اترقّى ⬆', W / 2, 625, 46, '#9ee89e');
    og.globalAlpha = smooth(M + 3.8, M + 4.1, t); txt('بستم: اتستبدل', W / 2, 705, 46, '#ff9a8a');
    og.globalAlpha = 1;
  }
  return c.toDataURL('image/png');
};
window.READY = true;
</script></body></html>
