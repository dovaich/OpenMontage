<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f2e">
  <meta name="mobile-web-app-capable" content="yes">
  <title>حي أم حمادة</title>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="tl">
      <canvas id="minimap" width="132" height="132"></canvas>
      <div id="stat"><b id="money">٠ ج</b><span id="clock"></span></div>
      <div id="slip"></div>
    </div>
    <div id="tr">
      <button id="switchBtn" class="ui"><img id="switchImg" alt=""><span id="switchName"></span></button>
      <button id="phoneBtn" class="ui">الموبايل</button>
    </div>
    <div id="obj"></div>
    <div id="arrowBox"><div id="arrow">▲</div><span id="arrowD"></span></div>
    <div id="card"><div id="cardAr"></div><div id="cardEn"></div></div>
    <div id="toast"></div>
    <div id="big"><div id="bigT"></div><div id="bigS"></div></div>
    <div id="dlg" class="ui"><img id="dlgImg" alt=""><div class="body"><div class="tag"><span id="dlgName"></span><small id="dlgEn"></small></div><div id="dlgText"></div></div></div>
    <div id="actions">
      <button id="ctxBtn" class="ui"></button>
      <div class="row1">
        <button id="jumpBtn" class="ui foot">نُط</button>
        <button id="exitBtn" class="ui car">انزل</button>
        <button id="hornBtn" class="ui car">كلاكس</button>
        <button id="brakeBtn" class="ui car">فرامل</button>
        <button id="nitroBtn" class="ui car off">نيترو</button>
      </div>
    </div>
    <div id="redWrap" class="car"><button id="redBtn" class="ui">الزرار<br>الأحمر</button><div class="fuelbar"><i id="fuel"></i></div></div>
    <div id="speed" class="car"></div>
    <div id="joy"><div id="knob"></div></div>
  </div>
  <div id="fade"></div>

  <div id="picker" class="ui">
    <div class="box">
      <div class="head"><b>اختار شخصيتك</b><small>CHOOSE YOUR CHARACTER</small><button id="pickClose" class="ui">✕</button></div>
      <div id="pickgrid"></div>
    </div>
  </div>
  <div id="phone" class="ui">
    <div class="box">
      <div class="head"><b>الموبايل</b><button id="phoneClose" class="ui">✕</button></div>
      <div class="tabs"><button class="tab ui" data-tab="missions">المهمات</button><button class="tab ui" data-tab="map">الخريطة</button><button class="tab ui" data-tab="owned">أملاكي</button><button class="tab ui" data-tab="cards">الكروت</button><button class="tab ui" data-tab="stats">التقدم</button><button class="tab ui" data-tab="settings">إعدادات</button></div>
      <div id="phoneBody"></div>
    </div>
  </div>
  <div id="title" class="ui">
    <div class="logo">حي أم حمادة</div>
    <div class="sub">HAY OM HAMADA</div>
    <div id="loading">بيحمّل البلد...</div>
    <button id="startBtn" class="ui">ابدأ</button>
    <button id="newBtn" class="ui">لعبة جديدة</button>
    <div class="hint">شمال الشاشة: امشي / سوق &nbsp;•&nbsp; يمين الشاشة: لف الكاميرا<br>الزرار الأخضر الكبير: اركب، ادخل، كلّم، ابدأ المهمة</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
